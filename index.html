<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>House Predictor</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">
<div class="container">
    <div class="row">
        <div class="card" style="width: 100%; height: 100%; margin-top: 50px">
            <div class="card-header bg-warning" style="text-align: center">
                <h1>Welcome to House Price Predictor🏠</h1>
            </div>
            <div class="card-body">
                <!-- Removed method and action since AJAX handles it -->
                <form id="prediction-form">
                    <div class="row">

                        <div class="col-md-6 form-group" style="text-align: center">
                            <label><b>Select the City:</b></label>
                            <select class="selectpicker form-control" id="city" name="city" required>
                                {% for location in locations %}
                                     <option value="{{location}}">{{location}}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 form-group" style="text-align: center">
                            <label><b>Enter BHK:</b></label>
                            <input type="text" class="form-control" id="bhk" name="bhk" placeholder="Enter BHK" required>
                        </div>
                        <div class="col-md-6 form-group" style="text-align: center">
                            <label><b>Enter Number of bathrooms:</b></label>
                            <input type="text" class="form-control" id="bath" name="bath" placeholder="Enter number of bathrooms" required>
                        </div>
                        <div class="col-md-6 form-group" style="text-align: center">
                            <label><b>Enter Square Feet:</b></label>
                            <input type="text" class="form-control" id="total_sqft" name="total_sqft" placeholder="Enter square feet" required>
                        </div>
                        <div class="col-md-12 form-group"><br>
                            <!-- Changed button type to 'button' to prevent default form submission -->
                            <button type="button" class="btn btn-primary form-control" onclick="send_data()">Predict Price</button>
                        </div>
                    </div>
                </form>
                <br>

                <div class="col-md-12" style="text-align: center">
                    <h3><span id="prediction"></span></h3>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    function send_data() {
        var form = document.getElementById('prediction-form');
        var fd = new FormData(form);

        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/predict', true);

        document.getElementById("prediction").innerHTML = "Wait Predicting Price!....";

        xhr.onreadystatechange = function() {
            if (xhr.readyState === XMLHttpRequest.DONE) {
                if (xhr.status === 200) {
                    document.getElementById('prediction').innerHTML = "Prediction: ₹" + xhr.responseText;
                } else {
                    document.getElementById('prediction').innerHTML = "Error in prediction.";
                }
            }
        };

        xhr.send(fd);
    }
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
